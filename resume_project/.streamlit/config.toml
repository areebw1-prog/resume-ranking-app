[server]
# Per-file upload cap in MB. Streamlit enforces this before the file reaches app code,
# so keep it equal to MAX_FILE_MB in app.py.
maxUploadSize = 5
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#8b5cf6"
backgroundColor = "#0b0d17"
secondaryBackgroundColor = "#141831"
textColor = "#e8eaf6"
font = "sans serif"
