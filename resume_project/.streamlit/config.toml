[server]
# Per-file upload cap in MB. Streamlit enforces this before the file reaches app code,
# so keep it equal to MAX_FILE_MB in app.py.
maxUploadSize = 5
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme.light]
primaryColor = "#7c3aed"
backgroundColor = "#f6f5ff"
secondaryBackgroundColor = "#ece9fd"
textColor = "#1b1d36"
font = "sans serif"

[theme.dark]
primaryColor = "#8b5cf6"
backgroundColor = "#0b0d17"
secondaryBackgroundColor = "#141831"
textColor = "#e8eaf6"
font = "sans serif"
